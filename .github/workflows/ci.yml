name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mac

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --show-sdk-version --sdk macosx

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: |
            mac/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('mac/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Swift test
        run: swift test

      - name: Validate release scripts
        run: bash -n scripts/*.sh

      - name: Build release products
        run: |
          swift build -c release --product DroidMate
          swift build -c release --product DroidMateMCP

      - name: Verify vendored server jar + scrcpy bin
        run: |
          test -f Resources/droidmate-server.jar
          test -x Sources/DroidMate/Bin/adb
          test -x Sources/DroidMate/Bin/scrcpy
          test -f Sources/DroidMate/Bin/scrcpy-server
          unzip -p Resources/droidmate-server.jar classes.dex | strings | grep -F '"protocol_version":1' >/dev/null
          unzip -p Resources/droidmate-server.jar classes.dex | strings | grep -F 'expected_modified' >/dev/null
          unzip -p Resources/droidmate-server.jar classes.dex | strings | grep -F 'download cancel req=' >/dev/null
          unzip -p Resources/droidmate-server.jar classes.dex | strings | grep -F 'upload size mismatch' >/dev/null
          unzip -p Resources/droidmate-server.jar classes.dex | strings | grep -F 'upload abort req=' >/dev/null
          unzip -p Resources/droidmate-server.jar classes.dex | strings | grep -F 'upload destination busy' >/dev/null
          unzip -p Resources/droidmate-server.jar classes.dex | strings | grep -F '.droidmate-upload-' >/dev/null
          unzip -p Resources/droidmate-server.jar classes.dex | strings | grep -F 'upload atomic replace req=' >/dev/null
          echo "jar $(wc -c < Resources/droidmate-server.jar) bytes"
